name: Build standalone binary

# Not part of the main CI gate (lint/tests run on every push) -- a
# PyInstaller build takes a few minutes and isn't needed to validate a normal
# code change. Trigger it by hand from the Actions tab, or by pushing a
# "v*" tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: PyInstaller build (Linux, ubuntu-24.04)
    runs-on: ubuntu-24.04
    # Publishing a release asset needs write access to repo contents; the
    # default GITHUB_TOKEN is otherwise read-only for a workflow_dispatch run.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the binary
        run: |
          chmod +x packaging/build.sh
          ./packaging/build.sh

      - name: Report binary size
        run: du -h dist/sensor-monitor

      # Drives the real pipeline through the frozen binary exactly like a
      # human would: start it, wait for /config, open a WebSocket client
      # against /ws and assert a real frame comes back with the right shape.
      # This is what catches "PyInstaller build succeeded, binary is
      # ModuleNotFoundError on first run" -- a working build and a working
      # program are two different claims, and only running it proves both.
      - name: Smoke test -- start the binary and verify the pipeline
        run: |
          ./dist/sensor-monitor --no-browser --port 48000 --uc-port 48765 &
          BIN_PID=$!

          echo "waiting for /config..."
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:48000/config > /dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 0.5
          done
          if [ "$ok" -ne 1 ]; then
            echo "binary never came up; is it still alive?"
            kill -0 "$BIN_PID" 2>/dev/null && echo "process is alive, just not answering" || echo "process exited"
            exit 1
          fi

          echo "== /config =="
          curl -sf http://127.0.0.1:48000/config
          echo

          python3 -m pip install --quiet websockets
          python3 packaging/smoke_test.py 48000 48765

          kill "$BIN_PID"

      - name: Upload binary as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensor-monitor-linux-x86_64
          path: dist/sensor-monitor
          if-no-files-found: error

      # Actions artifacts (the step above) require a signed-in GitHub account
      # to download, even on a public repo -- that's a platform limitation,
      # not something a repo setting can change. A Release asset has no such
      # restriction: anyone gets a plain, anonymous HTTPS download. This
      # updates one rolling release (tag "standalone-latest") in place on
      # every successful build, so there's always a single stable link
      # pointing at the most recent working binary, regardless of whether
      # this run came from a manual trigger or a version tag.
      - name: Publish as a public release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standalone-latest
          name: "Standalone binary (latest build)"
          body: |
            Automatically published by the **Build standalone binary**
            workflow from commit `${{ github.sha }}`. This tag always points
            at the most recent successful build, not a specific version.

            Download `sensor-monitor`, then:
            ```bash
            chmod +x sensor-monitor
            ./sensor-monitor
            ```
            No Python or Docker install needed. See the README's
            "Run the standalone binary" section for flags and details.
          files: dist/sensor-monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
