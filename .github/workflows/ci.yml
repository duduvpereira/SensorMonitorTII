name: Sensor Monitor CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  unit-tests:
    name: Unit Tests and Coverage (pytest)
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      # ==========================================================
      # UNIT TESTS + COVERAGE
      # ==========================================================

      - name: Run unit tests with coverage
        run: |
          python -m pytest \
            --junitxml=test-results.xml \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov


      # ==========================================================
      # PUBLISH TEST RESULTS (JUnit report na aba de Checks)
      # ==========================================================

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit


      # ==========================================================
      # JOB SUMMARY (badge + tabelas coloridas de testes e coverage)
      # ==========================================================

      - name: Publish job summary
        if: always()
        run: python .github/scripts/build_job_summary.py


      # ==========================================================
      # UPLOAD TEST RESULTS
      # ==========================================================

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn


      # ==========================================================
      # UPLOAD COVERAGE REPORT (XML + HTML)
      # ==========================================================

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: warn
